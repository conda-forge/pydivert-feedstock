schema_version: 1

context:
  name: pydivert
  version: "3.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/pydivert-${{ version }}.tar.gz
  sha256: e5cba087f3f17eb66cf50965cf9670c55691c580f81dcad20549a0ef49af8e06

build:
  number: 2
  skip: not win
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - hatchling
    - python
  run:
    - python

tests:
  - python:
      imports:
        - pydivert
      pip_check: true

about:
  summary: Python binding to windivert driver
  license: LGPL-3.0-or-later or GPL-2.0-or-later
  license_file:
    - LICENSE
    - LICENSE-LGPL-3.0-or-later
    - LICENSE-GPL-2.0-or-later
  homepage: https://github.com/ffalcinelli/pydivert
  documentation: https://pythonhosted.org/pydivert/

extra:
  recipe-maintainers:
    - jonashaag
    - freundTech

